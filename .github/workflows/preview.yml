name: preview

# Keeps the preview formulae on the latest published previews
# (scripts/find-preview.sh --all): xymon-{server,client}-preview on the next
# release's, xymon-{server,client}-preview@<milestone> on each unreleased
# milestone's; and in step with the normal formulae they are generated from
# (scripts/gen-preview.rb). The formulae that change are built and tested here
# on macOS, then committed to master: no pull request, since a push with this
# workflow's token would start no other workflow to test it.

on:
  schedule:
    - cron: "40 1 * * *"   # daily; xymon-experimental's build runs at 00:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 180   # a new milestone adds two builds
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Find the previews of the unreleased milestones
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/find-preview.sh --all | tee plan.tsv
          if [ -s plan.tsv ]; then echo "found=1" >> "$GITHUB_OUTPUT"; fi

      - name: Regenerate the preview formulae
        id: gen
        if: steps.find.outputs.found == '1'
        run: |
          ruby scripts/gen-preview.rb plan.tsv
          rm plan.tsv
          if [ -z "$(git status --porcelain -- Formula)" ]; then
            echo "Already on these previews and in step with the normal formulae."
          else
            git status --short -- Formula
            # The preview formulae whose source changed or that are new: built
            # below. One whose conflicts line alone changed is not.
            for f in $(git status --porcelain -- 'Formula/*-preview*.rb' | awk '$1 != "D" { print $2 }'); do
              if [ -z "$(git ls-files -- "$f")" ] || git diff -- "$f" | grep -q '^[-+]  version '; then
                basename "$f" .rb
              fi
            done > build.txt
            cat build.txt
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test each, one after the other (they conflict)
        if: steps.gen.outputs.changed == '1'
        run: |
          TAP=${GITHUB_REPOSITORY/homebrew-/}
          brew tap "$TAP" "$PWD"
          brew trust "$TAP"
          while read -r f; do
            brew install --build-from-source "$TAP/$f"
            brew test "$TAP/$f"
            brew uninstall "$f"
          done < build.txt

      - name: Commit to master
        if: steps.gen.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build.txt
          git add -A Formula
          git commit -m "preview formulae: $(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/xymon-server-preview@*.rb | paste -sd ' ')"
          git push origin HEAD:master
