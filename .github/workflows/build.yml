name: build (macOS)

# Compiles the formulae on a real macOS runner: the normal ones from the latest
# upstream commit (--HEAD), and also from their release tarball once they pin
# one; the preview ones from their pinned tarball. Then runs the installed
# xymon-server once for real (the `live` job), and the standalone client's
# service against it (`live-client`): a build that passes `brew test` can
# still never collect anything, as the client's service did (#28).
# - push / pull_request: verify a formula edit still builds.
# - weekly cron: rebuild the current main tip, so a breaking upstream commit
#   surfaces here rather than at a user's `brew install --HEAD`.
on:
  push:
    branches: [master]   # PR branches build via pull_request; a bare push
                         # trigger would double-build every PR push.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — rebuild latest HEAD

permissions:
  contents: read

jobs:
  formulae:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # Every formula of the tap, the preview@<milestone> ones included: they
      # come and go with the milestones, so the list is read, not written here.
      # Each with the source it is built from: a preview from its tarball; a
      # normal formula from main (--HEAD), and from its release tarball too
      # once it names one, so the stable build users get is tested as well.
      - id: list
        run: |
          cd Formula
          for f in *.rb; do
            n=${f%.rb}
            case $n in
              *-preview*) echo "$n tarball" ;;
              *) grep -q '^  url ' "$f" && echo "$n tarball"; echo "$n head" ;;
            esac
          done | jq -Rnc '[inputs | split(" ") | {formula: .[0], source: .[1]}]' > "$RUNNER_TEMP/list.json"
          echo "list=$(cat "$RUNNER_TEMP/list.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: formulae
    runs-on: macos-latest
    timeout-minutes: 30   # safety net against a build that stalls on a prompt
    strategy:
      fail-fast: false
      matrix:
        # The formulae conflict, so build each in its own runner rather than
        # installing them side by side.
        include: ${{ fromJSON(needs.formulae.outputs.list) }}
    name: ${{ matrix.formula }} (${{ matrix.source }})
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Derive the tap name
        # tap name = repo with the "homebrew-" prefix stripped (bonomani/xymon);
        # computed once so every later step operates on the same tap.
        run: echo "TAP=${GITHUB_REPOSITORY/homebrew-/}" >> "$GITHUB_ENV"

      - name: Register this checkout as a tap
        # `brew tap <name> <path>` registers the checked-out files as that tap,
        # so a PR tests the edited formula, not the pushed remote.
        run: brew tap "$TAP" "$PWD"

      - name: Trust this tap
        # Homebrew's Tap-Trust enforcement refuses to load formulae from a
        # third-party tap unless trusted. `brew install <formula>` auto-trusts
        # only the named formula, but the formulas' `conflicts_with` makes brew
        # load the sibling formula too, which is then refused. Trust the whole
        # (self-owned) tap so sibling loads work.
        run: brew trust "$TAP"

      - name: The preview formulae are in step with the normal ones
        # They are generated from them; an edit to a normal formula is carried
        # over by scripts/gen-preview.rb (the daily preview workflow runs it too).
        if: contains(matrix.formula, '-preview')
        run: ruby scripts/gen-preview.rb --check

      - name: Build ${{ matrix.formula }} from its ${{ matrix.source }}
        # --HEAD for main; without it, the formula's tarball (a preview has no
        # head, only its tarball).
        run: |
          case "${{ matrix.source }}" in
            head) brew install --HEAD --build-from-source "$TAP/${{ matrix.formula }}" ;;
            *)    brew install --build-from-source "$TAP/${{ matrix.formula }}" ;;
          esac

      - name: Show what was installed
        # Before `brew test`, so the keg listing is in the logs even when the
        # test block fails - that listing is what you need to debug it.
        run: brew list --verbose "${{ matrix.formula }}" || true

      - name: Run the formula's test block
        # `brew install` never runs `test do`, so without this the test block
        # is only ever syntax-checked. It also exercises the install wiring
        # (etc persistence symlink, runtime dirs) on the installed keg.
        run: brew test "$TAP/${{ matrix.formula }}"

      - name: Replace the keg, then clean up
        # A second pass over an existing keg, which a fresh install never
        # exercises. Bisected on the affected machine, this does NOT reproduce
        # the missing cgiwrap links - only a real `brew upgrade` between two
        # upstream revisions did - so it is here as coverage of the replace
        # path, not as a regression test for that bug.
        run: |
          brew reinstall --build-from-source "$TAP/${{ matrix.formula }}"
          brew cleanup "${{ matrix.formula }}"

      - name: Run the test block again on the replaced keg
        run: brew test "$TAP/${{ matrix.formula }}"

  live:
    # Does the installed server monitor? Started as its launchd service starts
    # it, the bundled client's report must come back out of xymond. One job per
    # source of xymon-server, not per formula: the client formula's own service
    # is checked by its test block, and the previews are copies of these two.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [tarball, head]
    name: live server (${{ matrix.source }})
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Register and trust this checkout as a tap
        # As in `build`: the edited formula, not the pushed remote, and the
        # sibling loads conflicts_with makes.
        run: |
          echo "TAP=${GITHUB_REPOSITORY/homebrew-/}" >> "$GITHUB_ENV"
          brew tap "${GITHUB_REPOSITORY/homebrew-/}" "$PWD"
          brew trust "${GITHUB_REPOSITORY/homebrew-/}"

      - name: Install xymon-server from its ${{ matrix.source }}
        run: |
          case "${{ matrix.source }}" in
            head) brew install --HEAD --build-from-source "$TAP/xymon-server" ;;
            *)    brew install --build-from-source "$TAP/xymon-server" ;;
          esac

      - name: Run the server and read the bundled client's report back
        # The script raises the SysV shared-memory sysctls xymond needs
        # (sudo, passwordless on the hosted runners) and says so if the
        # kernel refuses because a segment already exists.
        run: tests/live-server.sh "$(brew --prefix xymon-server)"

  live-client:
    # Does the standalone client's service collect and deliver? The two
    # formulae conflict, so the server is installed and unlinked first: the
    # conflict check wants the linked-keg record and the opt link both, and
    # unlinking removes only the first, so the server keeps the opt paths its
    # configuration points at and runs on. tests/live-client.sh starts both
    # as their service blocks do.
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [tarball, head]
    name: live client (${{ matrix.source }})
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Register and trust this checkout as a tap
        run: |
          echo "TAP=${GITHUB_REPOSITORY/homebrew-/}" >> "$GITHUB_ENV"
          brew tap "${GITHUB_REPOSITORY/homebrew-/}" "$PWD"
          brew trust "${GITHUB_REPOSITORY/homebrew-/}"

      - name: Install xymon-server, unlinked, then xymon-client, from their ${{ matrix.source }}
        run: |
          case "${{ matrix.source }}" in
            head) opt=--HEAD ;;
            *)    opt= ;;
          esac
          brew install $opt --build-from-source "$TAP/xymon-server"
          brew unlink xymon-server
          brew install $opt --build-from-source "$TAP/xymon-client"

      - name: Run both services and read the client's report back
        run: tests/live-client.sh "$(brew --prefix xymon-server)" "$(brew --prefix xymon-client)"
