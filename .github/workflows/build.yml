name: build (macOS)

# Compiles the formulae on a real macOS runner: the normal ones from the latest
# upstream commit (--HEAD), the preview ones from their pinned tarball.
# - push / pull_request: verify a formula edit still builds.
# - weekly cron: rebuild the current main tip, so a breaking upstream commit
#   surfaces here rather than at a user's `brew install --HEAD`.
on:
  push:
    branches: [master]   # PR branches build via pull_request; a bare push
                         # trigger would double-build every PR push.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — rebuild latest HEAD

permissions:
  contents: read

jobs:
  formulae:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # Every formula of the tap, the preview@<milestone> ones included: they
      # come and go with the milestones, so the list is read, not written here.
      - id: list
        run: |
          cd Formula
          echo "list=$(printf '%s\n' *.rb | sed 's/\.rb$//' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    needs: formulae
    runs-on: macos-latest
    timeout-minutes: 30   # safety net against a build that stalls on a prompt
    strategy:
      fail-fast: false
      matrix:
        # The formulae conflict, so build each in its own runner rather than
        # installing them side by side.
        formula: ${{ fromJSON(needs.formulae.outputs.list) }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Derive the tap name
        # tap name = repo with the "homebrew-" prefix stripped (bonomani/xymon);
        # computed once so every later step operates on the same tap.
        run: echo "TAP=${GITHUB_REPOSITORY/homebrew-/}" >> "$GITHUB_ENV"

      - name: Register this checkout as a tap
        # `brew tap <name> <path>` registers the checked-out files as that tap,
        # so a PR tests the edited formula, not the pushed remote.
        run: brew tap "$TAP" "$PWD"

      - name: Trust this tap
        # Homebrew's Tap-Trust enforcement refuses to load formulae from a
        # third-party tap unless trusted. `brew install <formula>` auto-trusts
        # only the named formula, but the formulas' `conflicts_with` makes brew
        # load the sibling formula too, which is then refused. Trust the whole
        # (self-owned) tap so sibling loads work.
        run: brew trust "$TAP"

      - name: The preview formulae are in step with the normal ones
        # They are generated from them; an edit to a normal formula is carried
        # over by scripts/gen-preview.rb (the daily preview workflow runs it too).
        if: contains(matrix.formula, '-preview')
        run: ruby scripts/gen-preview.rb --check

      - name: Build ${{ matrix.formula }}
        # --HEAD for the normal formulae (latest commit); a preview formula has
        # no head, only its tarball.
        run: |
          case "${{ matrix.formula }}" in
            *-preview*) brew install --build-from-source "$TAP/${{ matrix.formula }}" ;;
            *)         brew install --HEAD --build-from-source "$TAP/${{ matrix.formula }}" ;;
          esac

      - name: Show what was installed
        # Before `brew test`, so the keg listing is in the logs even when the
        # test block fails - that listing is what you need to debug it.
        run: brew list --verbose "${{ matrix.formula }}" || true

      - name: Run the formula's test block
        # `brew install` never runs `test do`, so without this the test block
        # is only ever syntax-checked. It also exercises the install wiring
        # (etc persistence symlink, runtime dirs) on the installed keg.
        run: brew test "$TAP/${{ matrix.formula }}"

      - name: Replace the keg, then clean up
        # A second pass over an existing keg, which a fresh install never
        # exercises. Bisected on the affected machine, this does NOT reproduce
        # the missing cgiwrap links - only a real `brew upgrade` between two
        # upstream revisions did - so it is here as coverage of the replace
        # path, not as a regression test for that bug.
        run: |
          brew reinstall --build-from-source "$TAP/${{ matrix.formula }}"
          brew cleanup "${{ matrix.formula }}"

      - name: Run the test block again on the replaced keg
        run: brew test "$TAP/${{ matrix.formula }}"
