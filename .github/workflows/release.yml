name: release

# When xymon-monitoring/xymon publishes a release, rel-X.Y.Z, newer than the
# one the normal formulae pin, pin them to it (scripts/pin-release.sh: url,
# sha256, and the preview formulae regenerated), build both from the tarball,
# run their test blocks and the two live tests, and open a pull request with
# the results. A pull request, not a push: the normal formulae are what
# users install, and a release can need a caveat or a migration this cannot
# write. The checks of build.yml do not run on a pull request this token
# opens, so build.yml is dispatched on the branch instead and the pull
# request links the run.

on:
  schedule:
    - cron: "40 2 * * *"   # daily, after the preview run at 01:40
  workflow_dispatch:
    inputs:
      version:
        description: "Release to pin (X.Y.Z); empty for the newest rel-* tag"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pin:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Is there a release newer than the pin?
        id: find
        run: |
          pinned=$(sed -n 's|^  url ".*/rel-\([0-9.]*\)/xymon-.*"$|\1|p' Formula/xymon-server.rb)
          want=${{ inputs.version }}
          if [ -z "$want" ]; then
            want=$(git ls-remote --tags --refs https://github.com/xymon-monitoring/xymon 'refs/tags/rel-*' |
                   sed 's|.*refs/tags/rel-||' | sort -V | tail -1)
          fi
          echo "pinned $pinned, newest release $want"
          if [ "$(printf '%s\n%s\n' "$pinned" "$want" | sort -V | tail -1)" = "$pinned" ]; then
            echo "nothing newer than the pin"; exit 0
          fi
          if gh pr list --head "release/pin-$want" --state all --json number -q '.[0].number' | grep -q .; then
            echo "a pull request for $want exists already"; exit 0
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: Pin the formulae to it
        if: steps.find.outputs.version != ''
        run: |
          scripts/pin-release.sh "${{ steps.find.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/pin-${{ steps.find.outputs.version }}"
          git add -A Formula
          git commit -q -m "Formula: pin the ${{ steps.find.outputs.version }} release"

      - name: Build both from the tarball, test them, and run them
        # `brew tap NAME PATH` clones PATH, so the commit above, not the tree.
        # The two formulae conflict: the server first, with its live test;
        # unlinked, the client beside it, with the client's, which needs the
        # server installed (tests/live-client.sh).
        if: steps.find.outputs.version != ''
        run: |
          TAP=${GITHUB_REPOSITORY/homebrew-/}
          brew tap "$TAP" "$PWD"
          brew trust "$TAP"
          : > results.md
          r() { if "$@" >>"log.txt" 2>&1; then echo "| $* | pass |" >> results.md; else echo "| $* | **fail** |" >> results.md; fail=1; fi; }
          fail=0
          r brew install --build-from-source "$TAP/xymon-server"
          r brew test "$TAP/xymon-server"
          r tests/live-server.sh "$(brew --prefix xymon-server)"
          r brew unlink xymon-server
          r brew install --build-from-source "$TAP/xymon-client"
          r brew test "$TAP/xymon-client"
          r tests/live-client.sh "$(brew --prefix xymon-server)" "$(brew --prefix xymon-client)"
          cat results.md
          [ "$fail" = 0 ] || { tail -100 log.txt; exit 1; }

      - name: Open the pull request
        if: steps.find.outputs.version != ''
        run: |
          v=${{ steps.find.outputs.version }}
          git push origin "release/pin-$v"
          {
            echo "Xymon $v is released (rel-$v): the normal formulae move from $(git show master:Formula/xymon-server.rb | sed -n 's|^  url ".*/rel-\([0-9.]*\)/xymon-.*"$|\1|p') to it, by \`scripts/pin-release.sh $v\`: url and sha256 in both, the tarball downloaded and checked against the release's .sha256 asset, and the preview formulae regenerated, which drops the milestone just released."
            echo
            echo "Built on this runner from the tarball, in this run:"
            echo
            echo "| step | result |"
            echo "|---|---|"
            cat results.md
            echo
            echo "The checks of build.yml do not run on a pull request opened with the workflow token; [this run of build.yml](https://github.com/$GITHUB_REPOSITORY/actions?query=branch%3Arelease%2Fpin-$v) was dispatched on the branch instead."
            echo
            echo "Left to a person: whether this release needs a caveat, a migration, or a README change the pin does not carry; the release notes say."
          } > body.md
          gh pr create --base master --head "release/pin-$v" \
            --title "Formula: pin the $v release" --body-file body.md
          gh workflow run build.yml --ref "release/pin-$v"
